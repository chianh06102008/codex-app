</style><div class="app"><header class="top"><div class="brand">Flood<span>Scout</span></div><button class="icon" id="language" aria-label="Switch to English">EN</button></header><div id="main"></div><nav class="nav" aria-label="Navigation"><button data-page="home"><svg viewBox="0 0 24 24"><path d="m3 10 9-7 9 7v10H3z"/></svg><span data-t="home"></span></button><button data-page="warning"><svg viewBox="0 0 24 24"><path d="M12 3 2 21h20L12 3Zm0 6v5m0 3v1"/></svg><span data-t="warning"></span></button><button data-page="report"><svg viewBox="0 0 24 24"><path d="M3 7h4l2-3h6l2 3h4v13H3z"/><circle cx="12" cy="13" r="3"/></svg><span data-t="report"></span></button><button data-page="settings"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 17h16M8 4v6m8 4v6"/></svg><span data-t="settings"></span></button></nav></div>
<script>
const dict={vi:{home:'Bản đồ',warning:'Cảnh báo',report:'Báo cáo',settings:'Cài đặt',status:'Chưa có tình trạng chính thức',statusText:'Không lấy được tình trạng chính thức. Đừng coi bản đồ trống là hết cảnh báo.',view:'Xem thông tin chính thức',preview:'Sơ đồ minh họa',location:'Đà Nẵng',title:'Trước khi lên đường',desc:'Kiểm tra thông tin chính thức và tình trạng đường trước khi quyết định di chuyển.',ask:'Đi đường này?',reportAction:'Gửi thông tin ngập',maps:'Hiện Google Maps',back:'Quay lại',official:'Thông tin chính thức',unavailable:'Chưa có bản tin được xác minh',officialDesc:'Hiện chưa kết nối được nguồn cảnh báo. Hãy xem thông tin trực tiếp từ cơ quan chính thức.',source:'Mở trang NCHMF',emergency:'113 · 114 · 115',emergencyDesc:'FloodScout không phải đơn vị cứu hộ.',dest:'Điểm đến',origin:'Điểm xuất phát',originHint:'Nhập điểm xuất phát',destHint:'Nhập địa điểm hoặc địa chỉ',mode:'Phương tiện',bike:'Xe máy',walk:'Đi bộ',car:'Ô tô',check:'Kiểm tra đường',refusal:'FloodScout không gợi ý đường nào.',refusalText:'Hãy ở lại và làm theo hướng dẫn chính thức.',reason:'Chưa đủ dữ liệu',reasonText:'Tình trạng chính thức và dữ liệu đường chưa có. Không thể đánh giá tuyến đường.',caveat:'Chỉ dùng đường có trên bản đồ. Hẻm có thể không có trong gợi ý.',dry:'Chỉ chụp từ chỗ khô ráo. Đừng đi vào nước để chụp.',ack:'Tôi đang ở chỗ khô ráo và đã dừng lại.',continue:'Tiếp tục',draft:'Bản nháp báo cáo',draftText:'Việc gửi báo cáo chưa khả dụng. Bản nháp được lưu trên thiết bị này.',note:'Ghi chú địa điểm',noteHint:'Ví dụ: tên đường hoặc giao lộ',save:'Lưu bản nháp',saved:'Đã lưu bản nháp trên thiết bị.',settingsTitle:'Cài đặt',language:'Ngôn ngữ',textSize:'Cỡ chữ',normal:'Thông thường',large:'Lớn',data:'Tiết kiệm dữ liệu',privacy:'Quyền riêng tư',privacyText:'Vị trí và ảnh chỉ được yêu cầu khi bạn sử dụng tính năng cần đến chúng.',retention:'Thông tin lưu trữ',retentionText:'Bản nháp được lưu trên thiết bị. Báo cáo ảnh chưa được gửi hoặc lưu trên máy chủ.',delete:'Xóa bản nháp',deleted:'Đã xóa bản nháp.',layers:'Lớp bản đồ',layersText:'Tình trạng chính thức luôn được hiển thị. Chưa có dữ liệu mưa hoặc báo cáo trực tiếp.',zoomIn:'Phóng to',zoomOut:'Thu nhỏ'},en:{home:'Map',warning:'Warnings',report:'Report',settings:'Settings',status:'Official status unavailable',statusText:'Official status is unavailable. An empty map is not an all-clear.',view:'View official information',preview:'Illustrative map',location:'Da Nang',title:'Before you travel',desc:'Check official information and road conditions before deciding whether to travel.',ask:'Check a way there?',reportAction:'Report flooding',maps:'Show Google Maps',back:'Back',official:'Official information',unavailable:'No verified bulletin available',officialDesc:'The warning source is unavailable. Check the official source directly.',source:'Open NCHMF website',emergency:'113 · 114 · 115',emergencyDesc:'FloodScout is not a rescue service.',dest:'Destination',origin:'Starting point',originHint:'Enter starting point',destHint:'Enter a place or address',mode:'Travel mode',bike:'Motorbike',walk:'Walking',car:'Car',check:'Check roads',refusal:'FloodScout will not suggest a way.',refusalText:'Stay, and follow the official instruction.',reason:'Insufficient information',reasonText:'Official status and road data are unavailable. The route cannot be assessed.',caveat:'This only uses mapped roads. Alleys may be missing.',dry:'Photograph only from dry ground. Do not enter the water to take a picture.',ack:'I am stopped on dry ground.',continue:'Continue',draft:'Report draft',draftText:'Report submission is unavailable. Your draft is stored on this device.',note:'Location note',noteHint:'For example, a road or intersection',save:'Save draft',saved:'Draft saved on this device.',settingsTitle:'Settings',language:'Language',textSize:'Text size',normal:'Normal',large:'Large',data:'Data saver',privacy:'Privacy',privacyText:'Location and photos are requested only when you use a feature that needs them.',retention:'Storage',retentionText:'Drafts stay on this device. Photo reports are not uploaded or stored on a server.',delete:'Delete draft',deleted:'Draft deleted.',layers:'Map layers',layersText:'Official status is always shown. Live rain and report data are unavailable.',zoomIn:'Zoom in',zoomOut:'Zoom out'}};
let lang=localStorage.getItem('fs-language')||'vi',page='home',mode='bike',zoom=13,google=false;const main=document.getElementById('main');function t(k){return dict[lang][k]}function esc(v){return String(v||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}function status(){return '<div class="status" role="alert"><strong>'+t('status')+'</strong><p>'+t('statusText')+'</p><button class="link" data-go="warning">'+t('view')+' →</button></div>'}function back(){return '<button class="back" data-go="home">← '+t('back')+'</button>'}function render(){document.documentElement.lang=lang;document.documentElement.style.fontSize=localStorage.getItem('fs-large')==='1'?'130%':'100%';document.getElementById('language').textContent=lang==='vi'?'EN':'VI';document.getElementById('language').setAttribute('aria-label',lang==='vi'?'Switch to English':'Chuyển sang tiếng Việt');document.querySelectorAll('[data-t]').forEach(e=>e.textContent=t(e.dataset.t));document.querySelectorAll('.nav button').forEach(e=>e.setAttribute('aria-current',e.dataset.page===page?'page':'false'));
if(page==='home'){main.innerHTML=status()+'<div class="map">'+(google?'<iframe title="Google Maps" src="https://maps.google.com/maps?q=16.061,108.218&z='+zoom+'&output=embed"></iframe>':'<svg viewBox="0 0 400 300" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><defs><pattern id="p" width="38" height="32" patternUnits="userSpaceOnUse" patternTransform="rotate(-20)"><path d="M0 0H38M0 0V32" stroke="#f7f9f5" stroke-width="6"/></pattern></defs><rect width="400" height="300" fill="url(#p)"/><path d="M290 -20C180 60 320 125 225 190S210 260 160 330" fill="none" stroke="#9bc9d6" stroke-width="48"/><path d="M0 145L400 220M0 240L400 35" stroke="#fff" stroke-width="7"/></svg><span class="map-label">'+t('preview')+'</span>')+'<div class="map-controls"><button class="icon" data-zoom="1" aria-label="'+t('zoomIn')+'">+</button><button class="icon" data-zoom="-1" aria-label="'+t('zoomOut')+'">−</button><button class="icon" data-go="layers" aria-label="'+t('layers')+'">☰</button></div></div><div class="content"><div class="row"><div><span class="tag">'+t('location')+'</span><h1 style="margin-top:12px">'+t('title')+'</h1></div></div><p class="muted intro">'+t('desc')+'</p><button class="link" id="mapButton">'+t('maps')+' →</button><div class="actions"><button class="button primary" data-go="ask">'+t('ask')+'</button><button class="button secondary" data-go="report">'+t('reportAction')+'</button></div></div>'}
else if(page==='warning')main.innerHTML=status()+'<div class="page">'+back()+'<h1>'+t('official')+'</h1><div class="notice"><strong>'+t('unavailable')+'</strong><p>'+t('officialDesc')+'</p></div><a href="https://nchmf.gov.vn/" target="_blank" rel="noopener">'+t('source')+' ↗</a><div class="section"><h2>'+t('emergency')+'</h2><p class="muted">'+t('emergencyDesc')+'</p></div></div>';
else if(page==='ask')main.innerHTML=status()+'<div class="page">'+back()+'<h1>'+t('ask')+'</h1><form id="route"><label class="field">'+t('origin')+'<input required placeholder="'+t('originHint')+'"></label><label class="field">'+t('dest')+'<input required placeholder="'+t('destHint')+'"></label><div class="field">'+t('mode')+'<div class="choices">'+['bike','walk','car'].map(x=>'<button type="button" class="button" data-mode="'+x+'" aria-pressed="'+(mode===x)+'">'+t(x)+'</button>').join('')+'</div></div><button class="button primary">'+t('check')+'</button></form></div>';
else if(page==='result')main.innerHTML=status()+'<div class="page">'+back()+'<div class="danger" role="alert"><h1>'+t('refusal')+'</h1><p>'+t('refusalText')+'</p></div><div class="section"><h2>'+t('reason')+'</h2><p class="muted">'+t('reasonText')+'</p></div><p class="muted intro">'+t('caveat')+'</p><button class="button secondary" data-go="warning">'+t('view')+'</button></div>';
else if(page==='report')main.innerHTML='<div class="page">'+back()+'<h1>'+t('reportAction')+'</h1><div class="danger"><h2>'+t('dry')+'</h2></div><label class="check"><input type="checkbox" id="ack"><span>'+t('ack')+'</span></label><button class="button primary" id="reportNext" disabled>'+t('continue')+'</button></div>';
else if(page==='draft')main.innerHTML='<div class="page">'+back()+'<h1>'+t('draft')+'</h1><p class="muted">'+t('draftText')+'</p><label class="field">'+t('note')+'<input id="note" placeholder="'+t('noteHint')+'" value="'+esc(localStorage.getItem('fs-draft'))+'"></label><button class="button primary" id="save">'+t('save')+'</button><p id="feedback" role="status"></p></div>';
else if(page==='layers')main.innerHTML=status()+'<div class="page">'+back()+'<h1>'+t('layers')+'</h1><p class="notice">'+t('layersText')+'</p></div>';
else main.innerHTML='<div class="page">'+back()+'<h1>'+t('settingsTitle')+'</h1><div class="section"><h2>'+t('language')+'</h2><button class="button" id="changeLang">'+(lang==='vi'?'Tiếng Việt / English':'English / Tiếng Việt')+'</button></div><div class="section"><h2>'+t('textSize')+'</h2><button class="button" id="font">'+(localStorage.getItem('fs-large')==='1'?t('normal'):t('large'))+'</button></div><div class="section"><h2>'+t('privacy')+'</h2><p class="muted">'+t('privacyText')+'</p></div><div class="section"><h2>'+t('retention')+'</h2><p class="muted">'+t('retentionText')+'</p><button class="link" id="delete">'+t('delete')+'</button><p id="feedback" role="status"></p></div></div>';
}
document.addEventListener('click',e=>{let el=e.target.closest('button');if(!el)return;if(el.dataset.go||el.dataset.page){page=el.dataset.go||el.dataset.page;render();window.scrollTo(0,0)}else if(el.dataset.mode){mode=el.dataset.mode;render()}else if(el.id==='language'||el.id==='changeLang'){lang=lang==='vi'?'en':'vi';localStorage.setItem('fs-language',lang);render()}else if(el.id==='mapButton'){google=true;render()}else if(el.dataset.zoom){zoom=Math.max(10,Math.min(19,zoom+Number(el.dataset.zoom)));if(google)render()}else if(el.id==='reportNext'){page='draft';render()}else if(el.id==='save'){localStorage.setItem('fs-draft',document.getElementById('note').value);document.getElementById('feedback').textContent=t('saved')}else if(el.id==='delete'){localStorage.removeItem('fs-draft');document.getElementById('feedback').textContent=t('deleted')}else if(el.id==='font'){localStorage.setItem('fs-large',localStorage.getItem('fs-large')==='1'?'0':'1');render()}});
document.addEventListener('change',e=>{if(e.target.id==='ack')document.getElementById('reportNext').disabled=!e.target.checked});document.addEventListener('submit',e=>{if(e.target.id==='route'){e.preventDefault();page='result';render();window.scrollTo(0,0)}});render();
</script></html>
