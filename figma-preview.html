<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>FloodScout — Figma preview</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet">
<style>
:root{font-family:'Plus Jakarta Sans',sans-serif;color:#191b14;background:#dedfd8;font-size:16px}*{box-sizing:border-box}body{margin:0}button,input{font:inherit}button{cursor:pointer;color:inherit}button:focus-visible,input:focus-visible{outline:3px solid #2862e9;outline-offset:2px}.app{width:min(100%,390px);height:100dvh;min-height:610px;margin:auto;background:#f3f4ef;position:relative;overflow:hidden;box-shadow:0 10px 45px #0002}h1,h2,h3,p{margin:0}h1{font-size:20px;line-height:28px;letter-spacing:-.2px}h2{font-size:18px;line-height:26px}p{line-height:24px}.muted{color:#5d6157}.small{font-size:13px;line-height:18px}.overline{text-transform:uppercase;font-size:13px;line-height:18px;letter-spacing:.06em;color:#5d6157;font-weight:600}.icon{font-family:'Material Symbols Outlined';font-size:24px;line-height:1;font-weight:normal}.view{height:100%;display:flex;flex-direction:column}.scroll{overflow:auto;flex:1;padding:16px}.header{display:flex;align-items:center;gap:14px;padding:16px 16px 4px}.back,.square{border:0;background:#fff;border-radius:16px;width:48px;height:48px;display:grid;place-items:center;box-shadow:0 8px 24px #1a1c1424;flex:none}.header .subtitle{font-size:14px;line-height:20px;color:#5d6157}.stack{display:grid;gap:14px}.card{background:white;border-radius:20px;padding:16px;box-shadow:0 4px 16px #1a1c140f}.soft{background:#ebede5;border-radius:20px;padding:16px}.alert{border:1.5px solid #c2410c;background:#fff3e6;border-radius:20px;padding:16px 18px}.alert .overline{color:#a33308}.alert h2{margin:5px 0}.link{border:0;background:transparent;padding:0;text-decoration:underline;text-underline-offset:3px;font-weight:600;text-align:left}.bottom{background:white;border-top:1px solid #dfe1d8;padding:16px 16px 20px}.primary{width:100%;border:0;border-radius:999px;background:#191b14;color:white;padding:18px 24px;font-size:17px;line-height:24px;font-weight:700;min-height:60px}.secondary{border:1.5px solid #dfe1d8;background:#fff;border-radius:999px;padding:12px 18px;min-height:48px;font-weight:600}.input{width:100%;height:56px;border:1.5px solid #dfe1d8;background:#fff;border-radius:999px;padding:0 16px;color:#191b14}.field{display:grid;gap:10px;font-weight:600}.segments{display:flex;background:#ebede5;border-radius:20px;padding:5px;gap:2px}.segments button{flex:1;border:0;background:transparent;border-radius:15px;min-height:50px;font-weight:600;color:#5d6157}.segments button.selected{background:#fff;color:#191b14;box-shadow:0 3px 10px #0001}.row{display:flex;align-items:center;gap:14px}.row>*:first-child{flex:none}.grow{flex:1;min-width:0}.toggle{width:52px;height:32px;border:0;border-radius:99px;background:#cdd1c7;padding:3px;display:flex;align-items:center}.toggle:after{content:'';display:block;background:white;width:26px;height:26px;border-radius:50%}.toggle[aria-checked=true]{background:#191b14;justify-content:flex-end}.sectionlabel{margin:8px 0}.rule{border:0;border-top:1px solid #dfe1d8;margin:14px 0}.chips{display:flex;gap:10px}.chips button{flex:1;border:1.5px solid #dfe1d8;border-radius:99px;background:#fff;min-height:56px;font-weight:600;white-space:nowrap}.chips button.selected{background:#191b14;color:#fff;border-color:#191b14}.home{position:absolute;inset:0;background:#e3e5dc;overflow:hidden}.mapgrid{position:absolute;inset:0;background:linear-gradient(90deg,transparent 29%,#fff 29%,#fff 34%,transparent 34%,transparent 73%,#fff 73%,#fff 77%,transparent 77%),linear-gradient(0deg,transparent 60%,#fff 60%,#fff 63%,transparent 63%)}.road{position:absolute;width:125%;height:27px;background:white;top:58%;left:-10%;transform:rotate(-16deg)}.road:after{content:'';position:absolute;background:#2862e9;border-radius:30px;width:25%;height:18px;left:10%;top:5px}.water{position:absolute;top:45%;left:29%;height:62px;width:20px;background:#97c4ff;border:2px dashed #2878ee;border-radius:20px}.maptext{position:absolute;font-size:13px;color:#60655c;font-weight:700}.marker{position:absolute;top:51%;left:48%;width:45px;height:45px;border-radius:50%;border:9px solid #bfd4ff;background:#2862e9}.maptop{position:absolute;top:16px;left:16px;right:16px}.brandrow{display:flex;justify-content:space-between;margin-bottom:10px}.brand,.lang{border:0;background:#fff;border-radius:99px;padding:12px 18px;font-weight:800;box-shadow:0 5px 20px #0001}.brand{font-size:20px}.lang{font-size:14px}.legend{display:flex;gap:8px;overflow:hidden;margin-top:10px}.legend span{white-space:nowrap;background:white;border-radius:99px;padding:10px 14px;font-size:13px;font-weight:600}.dot{display:inline-block;width:10px;height:10px;background:#bb2424;border-radius:50%;margin-right:7px}.maptools{position:absolute;right:16px;top:38%;display:grid;gap:10px}.maptools button{border:0;background:white;border-radius:16px;width:48px;height:48px;display:grid;place-items:center;box-shadow:0 8px 24px #0002}.pinlabel{position:absolute;top:57%;left:20px;background:white;border-radius:99px;padding:8px 12px;font-size:13px;font-weight:600;box-shadow:0 4px 15px #0002}.homebottom{position:absolute;bottom:0;width:100%;background:#fff;border-radius:24px 24px 0 0;padding:10px 16px 16px}.grab{width:40px;height:5px;background:#dfe1d8;border-radius:4px;margin:0 auto 16px}.search{border:0;background:#ebede5;border-radius:99px;width:100%;height:60px;margin:14px 0;display:flex;align-items:center;gap:12px;padding:0 12px 0 18px;color:#5d6157;text-align:left}.mic{margin-left:auto;width:48px;height:48px;background:#191b14;color:white;border-radius:50%;display:grid;place-items:center}.nav{display:flex;background:#191b14;border-radius:30px;padding:8px;color:#aeb2a6}.nav button{flex:1;border:0;background:none;color:inherit;border-radius:20px;padding:8px 2px;font-size:12px;font-weight:600}.nav button:first-child{background:#343730;color:#fff}.nav .icon{display:block;margin-bottom:4px}.demo{position:absolute;top:37.5%;left:12px;background:#191b14;color:white;border-radius:99px;padding:7px 12px;font-size:13px}.gate{background:#171a14;color:white}.gate .scroll{display:flex;flex-direction:column}.gatecenter{text-align:center;margin:auto 8px}.gatecenter h1{font-size:30px;line-height:38px;margin:24px 0}.gatecenter p{font-size:18px;line-height:26px;color:#d9dbd4}.gate .alert{color:#191b14}.gatefoot{text-align:center;color:#c5c8c0;font-size:14px}.hidden{display:none}
</style></head><body><main id="app" class="app"></main><script>
const app=document.querySelector('#app');let page='home',mode='Xe máy',depth='Bánh xe',ack=true,language='Tiếng Việt',size='Mặc định';const icon=(n)=>`<span class="icon" aria-hidden="true">${n}</span>`;const header=(title,sub='')=>`<header class="header"><button class="back" data-go="home" aria-label="Quay lại">${icon('chevron_left')}</button><div><h1>${title}</h1>${sub?`<p class="subtitle">${sub}</p>`:''}</div></header>`;const compact=()=>`<div class="alert"><h2>Cảnh báo mưa lớn đang có hiệu lực</h2><p class="muted">Trung tâm Dự báo KTTV Quốc gia · [GIỜ] · <button class="link" data-go="warning">Xem bản tin gốc</button></p></div>`;const warning=()=>`<div class="alert"><div class="overline">Cảnh báo chính thức</div><h2>Cảnh báo mưa lớn khu vực Hà Nội</h2><p class="muted">Trung tâm Dự báo KTTV Quốc gia · [GIỜ PHÁT HÀNH] · hiệu lực đến [GIỜ]</p><button class="link" data-go="warning">Xem bản tin gốc</button></div>`;const bottom=(label,go)=>`<div class="bottom"><button class="primary" data-go="${go}">${label}</button></div>`;const picker=(items,selected,kind)=>`<div class="segments">${items.map(x=>`<button class="${x===selected?'selected':''}" data-${kind}="${x}">${x}</button>`).join('')}</div>`;
function render(){if(page==='home'){app.innerHTML=`<div class="home"><div class="mapgrid"></div><div class="road"></div><div class="water"></div><div class="marker"></div><span class="maptext" style="top:43%;left:20px">Nguyễn Như Kon Tum</span><span class="maptext" style="top:62%;left:61%;transform:rotate(-16deg)">Nguyễn Trãi</span><span class="maptext" style="top:57%;left:51%;color:#2862e9">Bạn</span><div class="maptop"><div class="brandrow"><button class="brand" data-go="home">FloodScout</button><button class="lang" data-go="settings">VI · EN</button></div>${warning()}<div class="legend"><span><i class="dot"></i>Tránh</span><span><i class="dot" style="background:#d98000"></i>Không nên đi</span><span><i class="dot" style="background:#6b7280"></i>Chưa rõ</span></div></div><span class="demo">Dữ liệu demo</span><button class="pinlabel" data-go="segment">Ngang bánh xe · 20 phút</button><div class="maptools"><button aria-label="Phóng to">${icon('add')}</button><button aria-label="Thu nhỏ">${icon('remove')}</button><button data-go="segment" aria-label="Thông tin đoạn đường">${icon('layers')}</button><button aria-label="Vị trí">${icon('near_me')}</button></div><div class="homebottom"><div class="grab"></div><h1>Đi đường này?</h1><p class="small muted" style="margin-top:4px">Chưa thấy dấu hiệu bất lợi gần đây. Đây không phải xác nhận an toàn.</p><button class="search" data-go="ask">${icon('search')} Nhập hoặc nói điểm đến <span class="mic">${icon('mic')}</span></button><nav class="nav"><button data-go="home">${icon('map')}Bản đồ</button><button data-go="warning">${icon('warning')}Cảnh báo</button><button data-go="report">${icon('photo_camera')}Báo cáo</button><button data-go="settings">${icon('tune')}Cài đặt</button></nav></div></div>`;return}
if(page==='ask'){app.innerHTML=`<div class="view">${header('Hỏi về một nơi đến')}<div class="scroll stack">${compact()}<label class="field">Từ<input class="input" value="Vị trí hiện tại"></label><label class="field">Đến<input class="input" value="Biblio"></label><div class="field">Phương tiện${picker(['Xe máy','Đi bộ','Ô tô'],mode,'mode')}</div><div class="soft"><strong>Chỉ dùng đường có trên bản đồ. Hẻm có thể không có trong gợi ý.</strong><p class="muted">Nếu mọi đường đều qua đoạn cần tránh, FloodScout sẽ không gợi ý đường nào.</p></div></div>${bottom('Đi đường này?','segment')}</div>`;return}
if(page==='warning'){app.innerHTML=`<div class="view">${header('Cảnh báo chính thức','Trung tâm Dự báo KTTV Quốc gia')}<div class="scroll stack">${warning()}<div class="card stack">${[['Đơn vị phát hành','Trung tâm Dự báo KTTV Quốc gia'],['Phát hành','[GIỜ, NGÀY]'],['Hiệu lực','[GIỜ] – [GIỜ]'],['Khu vực','[Mọi địa danh như trong bản tin]'],['Lấy về lúc','[GIỜ]']].map(([a,b])=>`<div class="row" style="align-items:start"><span class="muted small" style="width:40%">${a}</span><strong class="small">${b}</strong></div>`).join('')}<a class="link" href="https://nchmf.gov.vn/" target="_blank" rel="noreferrer">Mở bản tin gốc · nchmf.gov.vn</a></div><div class="alert"><div class="overline">Hướng dẫn sơ tán / nơi trú ẩn</div><strong>[Nguyên văn hướng dẫn sơ tán hoặc nơi trú ẩn, nếu bản tin có. Nếu không có, khối này không hiện.]</strong></div><div class="alert" style="border-color:#ffb167"><div class="overline">Nguyên văn bản tin</div><p class="small">[Trích nguyên văn phần hướng dẫn của bản tin chính thức]</p></div><div class="soft"><div class="overline">Tóm tắt — không thay thế bản tin</div><p class="small">[Tóm tắt chỉ sinh từ các trường của bản tin. Trường nào thiếu thì ghi là thiếu. Không làm nhẹ đi lời bản tin.]</p></div><div class="soft"><div class="overline">Ảnh hưởng đến gợi ý đường</div><strong>Cảnh báo chính thức đang có hiệu lực. Ảnh người dân không thể hạ mức này.</strong></div><div class="card"><div class="overline">Khẩn cấp</div><strong>113 · 114 · 115. FloodScout không phải đơn vị cứu hộ.</strong><p class="small muted">[Đường dây nóng in trong bản tin, nếu có]</p></div></div><div class="bottom"><a class="primary" style="display:block;text-align:center;text-decoration:none" href="https://nchmf.gov.vn/" target="_blank" rel="noreferrer">Mở bản tin gốc</a></div></div>`;return}
if(page==='report'){app.innerHTML=`<div class="view">${header('Báo cáo ngập')}<div class="scroll stack"><label class="alert row"><input type="checkbox" id="ack" ${ack?'checked':''} style="width:26px;height:26px;accent-color:#191b14"><span><strong>Chỉ chụp từ chỗ khô ráo.</strong> Đừng đi vào nước để chụp.</span></label><div class="card row"><span class="mic" style="margin:0;width:64px;height:64px">${icon('mic')}</span><div><div class="overline">Bạn nói</div><h2>“Ở đầu ngõ Nguyễn Trãi đang bị ngập”</h2></div></div><div class="row" style="align-items:start"><div style="width:120px;height:120px;background:#d9dcd2;border-radius:20px;display:grid;place-items:center;text-align:center;color:#5d6157">[Ảnh đường<br>ngập]</div><div><div class="overline">AI đề xuất</div><h1>Ngang bánh xe</h1><p class="muted">Dựa vào bánh xe máy trong ảnh. Bạn chọn lại bên dưới nếu chưa đúng.</p></div></div><div class="card stack"><div class="row"><div class="grow"><div class="overline">Vị trí</div><strong>Đầu ngõ Nguyễn Trãi</strong></div><button class="secondary" data-go="home">Đổi vị trí</button></div><div class="overline">Mức nước (bắt buộc chọn)</div><div class="chips">${['Mắt cá','Bánh xe','Chưa rõ'].map(x=>`<button class="${depth===x?'selected':''}" data-depth="${x}">${x}</button>`).join('')}</div></div></div><div class="bottom"><button class="primary" id="send" ${ack?'':'disabled'}>Gửi báo cáo</button><p class="muted" style="text-align:center;margin-top:10px">Báo cáo hết tác dụng sau 12 giờ. Ảnh demo được ghi rõ là dữ liệu demo.</p></div></div>`;return}
if(page==='segment'){app.innerHTML=`<div class="view">${header('Đầu ngõ Nguyễn Trãi','Vì sao đoạn này bị đánh dấu')}<div class="scroll stack"><div class="card row" style="align-items:stretch"><div style="background:#bd2225;border-radius:9px;width:7px"></div><div><div class="overline">Trạng thái</div><h1 style="font-size:26px">Tránh</h1><p class="muted">Không gợi ý đường đi qua đoạn này cho xe máy và đi bộ.</p></div></div><div class="alert"><div class="overline">Mức sàn chính thức</div><strong>Cảnh báo mưa lớn · Trung tâm Dự báo KTTV Quốc gia · [GIỜ]</strong><p>Ảnh người dân không thể hạ mức này.</p><button class="link" data-go="warning">Xem bản tin gốc</button></div><h2>Báo cáo của người dân</h2>${[['Ngang bánh xe','Bánh xe','Bánh xe','20 phút trước · đang tính'],['Chưa rõ, có thấy nước','Chưa rõ','không đủ căn cứ','1 giờ trước · trọng số đang giảm'],['Ngang mắt cá','Mắt cá','Bánh xe','13 giờ trước · đã hết hạn, không còn tính']].map((r,i)=>`<div class="card row" style="align-items:start;${i===2?'opacity:.55':''}"><span style="width:14px;height:14px;border-radius:3px;background:${i===2?'#e69a40':'#bd2225'};margin-top:4px"></span><div><strong>${r[0]}</strong><p class="muted">Người báo đã chọn: ${r[1]} · AI đề xuất: ${r[2]}<br>${r[3]}</p>${i<2?'<button class="link" data-go="report">Xem ảnh</button>':''}</div></div>`).join('')}<div class="soft"><div class="overline">Độ mới</div><p>Báo cáo hết tác dụng sau 12 giờ. Khi đang mưa lớn, trọng số giảm một nửa sau khoảng 45 phút. Ảnh “không thấy nước” không thể gỡ mức sàn chính thức.</p></div></div></div>`;return}
if(page==='settings'){app.innerHTML=`<div class="view">${header('Cài đặt')}<div class="scroll stack"><div><div class="overline sectionlabel">Ngôn ngữ</div>${picker(['Tiếng Việt','English'],language,'language')}</div><div><div class="overline sectionlabel">Cỡ chữ</div>${picker(['Mặc định','Lớn','Rất lớn'],size,'size')}</div><div><div class="overline sectionlabel">Hiển thị</div><div class="card row"><div class="grow"><strong>Tiết kiệm dữ liệu</strong><p class="muted">Chỉ bản đồ và cảnh báo. Không ảnh vệ tinh. Ảnh nén nhỏ.</p></div><button class="toggle" role="switch" aria-checked="false" aria-label="Tiết kiệm dữ liệu"></button></div></div><div><div class="overline sectionlabel">Quyền và đồng ý</div><div class="card"><div class="row"><div class="grow"><strong>Vị trí chính xác</strong><p class="muted">Chỉ khi bạn gửi báo cáo hoặc hỏi đường. Không theo dõi liên tục.</p></div><button class="toggle" role="switch" aria-checked="true" aria-label="Vị trí chính xác"></button></div><hr class="rule"><div class="row"><div class="grow"><strong>Ảnh</strong><p class="muted">Chỉ khi bạn báo cáo. Mặt người và biển số được làm mờ trên máy.</p></div><button class="toggle" role="switch" aria-checked="true" aria-label="Ảnh"></button></div></div><div class="soft" style="margin-top:8px">Ảnh được phân tích trên máy chủ đặt ngoài Việt Nam ([nơi đặt máy chủ]). Bạn có thể rút lại đồng ý bất cứ lúc nào.</div></div><div><div class="overline sectionlabel">Dữ liệu của bạn</div><div class="card"><p>Ảnh được giữ tối đa 7 ngày. Sau đó chỉ giữ mức nước, đoạn đường và thời gian. Báo cáo không có tài khoản được tính nhẹ hơn.</p><button class="secondary" style="width:100%;color:#bd2225;margin-top:14px" id="delete">Xoá báo cáo của tôi</button></div></div><button class="secondary" data-go="gate">Xem màn hình dừng xe</button></div></div>`;return}
if(page==='gate'){app.innerHTML=`<div class="view gate"><div class="scroll">${compact()}<div class="gatecenter"><span class="icon" style="font-size:88px">pause_circle</span><h1>Dừng xe trước khi xem tiếp.</h1><p>Bạn đang di chuyển trên 15 km/h. Gợi ý đường và máy ảnh tạm ẩn cho đến khi bạn dừng.</p><button class="secondary" style="margin-top:28px" data-go="home">Đã dừng xe</button></div><p class="gatefoot">113 · 114 · 115. FloodScout không phải đơn vị cứu hộ.</p></div></div>`}}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.go){page=b.dataset.go;render()}else if(b.dataset.mode){mode=b.dataset.mode;render()}else if(b.dataset.depth){depth=b.dataset.depth;render()}else if(b.dataset.language){language=b.dataset.language;render()}else if(b.dataset.size){size=b.dataset.size;render()}else if(b.classList.contains('toggle'))b.setAttribute('aria-checked',b.getAttribute('aria-checked')!=='true');else if(b.id==='send'){alert('Đây là bản xem trước. Không có báo cáo nào được gửi.')}else if(b.id==='delete'){alert('Đây là bản xem trước. Không có dữ liệu nào được lưu.')}});document.addEventListener('change',e=>{if(e.target.id==='ack'){ack=e.target.checked;document.querySelector('#send').disabled=!ack}});render();
</script></body></html>
